<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم جامع حساب‌کتاب و گزارش‌گیری کلینیک</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-Regular.woff2') format('woff2');
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
        }
        .patient-row {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }
        .patient-row h4 {
            margin-top: 0;
            color: #16a085;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .remove-btn {
            position: absolute;
            left: 15px;
            top: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-bottom: 20px;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-add:hover { background: #2ecc71; }

        .btn-submit {
            background: #2980b9;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Vazirmatn', sans-serif;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #3498db; }

        .summary-box {
            background: #eafaf1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #a9dfbf;
            margin-bottom: 20px;
        }
        .summary-box p {
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .btn-danger {
            background: #c0392b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Vazirmatn';
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 ثبت کارکرد و حساب‌کتاب مراجعین کلینیک</h2>

    <div class="summary-box">
        <div class="form-group">
            <label>نام درمانگر:</label>
            <select id="therapist" required>
                <option value="">انتخاب کنید...</option>
                <option value="احسان جاسمی">احسان جاسمی</option>
                <option value="فاطمه امامی">فاطمه امامی</option>
                <option value="کامیاب فتحعلی">کامیاب فتحعلی</option>
                <option value="سارا نادری">سارا نادری</option>
                <option value="مهسا جواد نوری">مهسا جواد نوری</option>
                <option value="فاطمه کیانی">فاطمه کیانی</option>
                <option value="خانم حق شناس (روانشناس)">خانم حق شناس (روانشناس)</option>
                <option value="خانم موسوی (کاردرمان)">خانم موسوی (کاردرمان)</option>
                <option value="امین لب ابیان">امین لب ابیان</option>
            </select>
        </div>

        <p>تعداد مراجعین این ثبت: <span id="total-count" style="color:#2980b9">0 نفر</span></p>
        <p>جمع کارکرد کارتخوان: <span id="total-card" style="color:#27ae60">0 تومان</span></p>
        <p>جمع نقدی / کارت‌به‌کارت: <span id="total-cash" style="color:#e67e22">0 تومان</span></p>
    </div>

    <div id="patients-container">
        <!-- Patient rows added dynamically -->
    </div>

    <button class="btn-add" onclick="addPatient()">+ افزودن مراجع جدید</button>
    <button class="btn-submit" onclick="saveReport()">💾 ثبت نهایی در گزارشات کلینیک</button>
</div>

<div class="container">
    <h3>📊 دفتر کل حساب‌کتاب و گزارشات ثبت‌شده</h3>
    <div style="overflow-x: auto;">
        <table id="report-table">
            <thead>
                <tr>
                    <th>تاریخ و ساعت</th>
                    <th>درمانگر</th>
                    <th>نام مراجع</th>
                    <th>مبلغ (تومان)</th>
                    <th>وضعیت جلسه</th>
                    <th>پرداخت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="report-body">
                <!-- Data loaded from localStorage -->
            </tbody>
        </table>
    </div>
    <br>
    <button class="btn-danger" onclick="clearAllData()">🗑️ پاک کردن کل گزارشات</button>
</div>

<script>
    let patientCount = 0;

    function addPatient() {
        patientCount++;
        const container = document.getElementById('patients-container');
        const row = document.createElement('div');
        row.className = 'patient-row';
        row.id = `patient-${patientCount}`;

        row.innerHTML = `
            <button class="remove-btn" onclick="removePatient(${patientCount})">حذف</button>
            <h4>مراجع ${patientCount}</h4>

            <div class="form-group">
                <label>نام و نام خانوادگی مراجع:</label>
                <input type="text" class="p-name" placeholder="مثال: علی احمدی" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>مبلغ تعرفه (تومان):</label>
                    <input type="number" class="p-amount" value="894000" oninput="calculateTotals()" required>
                </div>

                <div class="form-group">
                    <label>وضعیت جلسه:</label>
                    <select class="p-status" required>
                        <option value="برگزار شد">برگزار شد</option>
                        <option value="کنسلی مراجع (بدون کسر)">کنسلی مراجع (بدون کسر)</option>
                        <option value="کنسلی مراجع (با کسر)">کنسلی مراجع (با کسر)</option>
                        <option value="کنسلی کلینیک/درمانگر">کنسلی کلینیک/درمانگر</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>نحوه پرداخت:</label>
                    <select class="p-payment" onchange="calculateTotals()" required>
                        <option value="کارتخوان">کارتخوان</option>
                        <option value="کارت به کارت">کارت به کارت</option>
                        <option value="نقدی">نقدی</option>
                        <option value="تسویه نشده / بدهکار">تسویه نشده / بدهکار</option>
                    </select>
                </div>
            </div>
        `;
        container.appendChild(row);
        calculateTotals();
    }

    function removePatient(id) {
        document.getElementById(`patient-${id}`).remove();
        calculateTotals();
    }

    function calculateTotals() {
        let totalCard = 0;
        let totalCash = 0;
        let count = 0;

        document.querySelectorAll('.patient-row').forEach(row => {
            count++;
            const amount = parseInt(row.querySelector('.p-amount').value) || 0;
            const payment = row.querySelector('.p-payment').value;

            if(payment === 'کارتخوان') totalCard += amount;
            else if(payment === 'نقدی' || payment === 'کارت به کارت') totalCash += amount;
        });

        document.getElementById('total-count').innerText = count + ' نفر';
        document.getElementById('total-card').innerText = totalCard.toLocaleString() + ' تومان';
        document.getElementById('total-cash').innerText = totalCash.toLocaleString() + ' تومان';
    }

    function saveReport() {
        const therapist = document.getElementById('therapist').value;
        if (!therapist) {
            alert("لطفاً نام درمانگر را انتخاب کنید.");
            return;
        }

        const rows = document.querySelectorAll('.patient-row');
        if (rows.length === 0) {
            alert("لطفاً حداقل یک مراجع اضافه کنید.");
            return;
        }

        let reports = JSON.parse(localStorage.getItem('clinic_reports') || '[]');
        const now = new Date().toLocaleString('fa-IR');

        rows.forEach(row => {
            reports.push({
                date: now,
                therapist: therapist,
                name: row.querySelector('.p-name').value,
                amount: row.querySelector('.p-amount').value,
                status: row.querySelector('.p-status').value,
                payment: row.querySelector('.p-payment').value
            });
        });

        localStorage.setItem('clinic_reports', JSON.stringify(reports));
        alert("✅ گزارش با موفقیت در دفتر کل حساب‌کتاب ثبت شد!");
        location.reload();
    }

    function loadReports() {
        const reports = JSON.parse(localStorage.getItem('clinic_reports') || '[]');
        const tbody = document.getElementById('report-body');
        tbody.innerHTML = '';

        if(reports.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="color:#888;">هنوز گزارشی ثبت نشده است.</td></tr>';
            return;
        }

        reports.reverse().forEach((r, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.date}</td>
                <td><b>${r.therapist}</b></td>
                <td>${r.name}</td>
                <td>${parseInt(r.amount).toLocaleString()} تومان</td>
                <td>${r.status}</td>
                <td>${r.payment}</td>
                <td><button class="btn-danger" onclick="deleteItem(${reports.length - 1 - idx})">حذف</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteItem(index) {
        let reports = JSON.parse(localStorage.getItem('clinic_reports') || '[]');
        reports.splice(index, 1);
        localStorage.setItem('clinic_reports', JSON.stringify(reports));
        loadReports();
    }

    function clearAllData() {
        if(confirm("آیا مطمئن هستید که تمام گزارشات مالی پاک شوند؟")) {
            localStorage.removeItem('clinic_reports');
            loadReports();
        }
    }

    addPatient();
    loadReports();
</script>

</body>
</html>
